# Le socle Rust des applis Aria : ce que toute appli doit tenir (docs/CONTRAT.md), partagé par toutes.
#
# Les applis le reçoivent comme dépendance git du dépôt modèle, épinglée par tag (décision 0007) ; dans le dépôt
# modèle, le squelette le prend par son chemin. Sa version est celle du dépôt modèle : un tag vX.Y.Z par version.
[package]
name = "aria-coeur"
description = "Le socle des applis Aria : identité, dossier de données, réglages, journal, sauvegardes, secrets, démarrage automatique, icône, installation, désinstallation, mises à jour, et la fenêtre Tauri qui les montre."
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
# Publie la liste de ses commandes au build.rs de l'appli (variable DEP_ARIA_COEUR_COMMANDES) : l'appli les autorise
# sans les recopier.
links = "aria-coeur"

[features]
default = []
# La fenêtre Tauri du socle : lancement, commandes, installation, mises à jour, icône, désinstallation. Toute appli
# l'active ; sans elle, le reste se teste sur n'importe quel système, sans moteur d'affichage.
fenetre = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:ureq"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Dates du journal et des sauvegardes, à l'heure locale. chrono n'est plus maintenu (RUSTSEC-2026-0543).
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
# Le zip des mises à jour : décompression deflate seule, en Rust (sans C à compiler).
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# tray-icon : l'icône de notification des applis qui servent en arrière-plan.
tauri = { version = "2.12.7", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2.5.5", optional = true }
# Les mises à jour : HTTPS par SChannel, avec les certificats et le proxy de Windows.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "win-system-proxy"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
# Relire une date du journal dans les tests.
time = { version = "0.3.55", features = ["parsing"] }

[lints.rust]
# Pas de code « unsafe » hors des appels à Windows, qui l'autorisent un par un, avec la raison écrite.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Une erreur se traite ou remonte : jamais un plantage silencieux hors des tests (clippy.toml les autorise là).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
