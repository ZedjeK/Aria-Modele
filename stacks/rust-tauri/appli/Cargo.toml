[package]
name = "aria-appli"
description = "L'appli Windows : fenêtre Tauri, interface Svelte, appels à Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Interface embarquée dans l'exe (build.ps1 l'active) ; sans elle, la fenêtre charge le serveur de développement.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
# Le socle partagé des applis Aria (décision 0007). Dans le dépôt modèle, par son chemin ; init.ps1 le remplace par
# la dépendance git du dépôt modèle, épinglée par le tag de sa version.
aria-coeur = { path = "../../../socle/coeur", features = ["fenetre"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.7", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
