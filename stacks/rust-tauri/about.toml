# Réglages de cargo-about 0.9.3, pour tools\licences-rust.ps1 : la partie Rust de LICENCES-TIERS.txt.
#
# Les licences acceptées sont celles de deny.toml ([licenses] allow) : les deux listes changent ensemble.

accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# L'exe ne tourne que sous Windows.
targets = ["x86_64-pc-windows-msvc"]

# Seulement ce qui est compilé dans l'exe : ni les outils de compilation (build.rs), ni les dépendances des tests.
ignore-build-dependencies = true
ignore-dev-dependencies = true
