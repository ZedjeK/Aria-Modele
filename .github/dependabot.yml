# Mises à jour automatiques : une PR par semaine et par écosystème, 5 ouvertes au plus, les petites montées groupées.
# Désactivable en supprimant ce fichier.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
  # <<STACK:dependabot>>
