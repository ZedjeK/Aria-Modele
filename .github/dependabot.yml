# Mises à jour automatiques : une PR par semaine et par écosystème, 5 ouvertes au plus, les petites montées groupées.
# Une nouvelle version d'action n'est proposée qu'après 7 jours : le temps qu'une version piégée soit repérée et
# retirée. Les correctifs de sécurité ne sont pas concernés par ce délai.
# Désactivable en supprimant ce fichier.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
  # <<STACK:dependabot>>
  # <!-- MODELE:debut -->
  # Dépôt modèle seulement : les dépendances des squelettes (stacks\). init.ps1 retire ces blocs dans l'appli créée,
  # qui garde celui de sa stack. Les actions recopiées dans les _socle\outils.txt ne sont pas lues par Dependabot :
  # tools\tester.ps1 vérifie qu'elles gardent le SHA des workflows.
  - package-ecosystem: "nuget"
    directories:
      - "/stacks/dotnet-wpf/src/*"
      - "/stacks/dotnet-wpf/tests/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      squelette-nuget-mineures:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/stacks/python-fastapi"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      squelette-pip-mineures:
        update-types: ["minor", "patch"]
  # <!-- MODELE:fin -->
