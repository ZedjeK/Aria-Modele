# Tests : sur chaque PR vers main et sur chaque push sur main.
#
# Aucun filtre de chemins (paths, paths-ignore) : un workflow ignoré laisserait le check « tests » en attente et
# bloquerait toute PR, puisque le ruleset de main l'exige.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Seulement sur les PR : deux fusions rapprochées n'annulent pas le run de main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  tests: # ce nom est celui que le ruleset exige : ne jamais le renommer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <<STACK:outils>>

      # Règles et exceptions dans PSScriptAnalyzerSettings.psd1. Le module est installé à une version exacte :
      # à monter à la main, par une PR, comme les autres outils (Dependabot ne le suit pas).
      - name: Analyse des scripts PowerShell
        run: |
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.25.0]' -Repository PSGallery -TrustRepository -Quiet
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $remarques = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($remarques.Count -gt 0) {
            $remarques | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
            throw "PSScriptAnalyzer : $($remarques.Count) remarque(s) à corriger."
          }
          Write-Host 'PSScriptAnalyzer : aucune remarque.'

      - name: Tests
        run: ./tools/tester.ps1

      # Les scripts .ps1 doivent aussi tourner sous Windows PowerShell 5.1, celui livré avec Windows.
      # Même job : le check exigé par le ruleset garde son nom « tests ».
      - name: Tests sous Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/tester.ps1
