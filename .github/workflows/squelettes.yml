# Squelettes : chaque stack de stacks\ passe par init.ps1, compile son exe et en fait le zip (tools\tester-squelettes.ps1).
#
# Fichier du dépôt modèle seulement : init.ps1 le supprime dans l'appli créée.
name: Squelettes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: squelettes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  squelettes:
    runs-on: windows-latest
    # La stack Rust compile Tauri deux fois (tests, puis exe optimisé).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outils de toutes les stacks déjà écrites
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Version exacte de Node.js de la stack : à monter à la main, par une PR, comme rust-toolchain.toml
          # (Dependabot ne le suit pas).
          node-version-file: stacks/rust-tauri/.node-version

      - name: Rust (la version de rust-toolchain.toml de la stack, la même que celle du socle)
        working-directory: stacks/rust-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            stacks/rust-tauri
            socle/coeur
          # Seule main enregistre le cache ; les PR le lisent sans pouvoir le remplacer.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-deny et cargo-about de la stack Rust, aux versions de stacks/rust-tauri/_socle/outils.txt.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3

      - name: Squelettes
        run: ./tools/tester-squelettes.ps1
