# Release : pousser un tag « vX.Y.Z » teste, construit l'exe portable, en fait le zip et son empreinte, atteste sa
# provenance, puis crée la release en BROUILLON. Tu relis les notes, tu vérifies l'empreinte et tu publies : publier
# est le geste qui prévient les utilisateurs, aucun workflow ne le fait à ta place.
#
#     git tag -a v1.2.3 -m "Version 1.2.3"; git push origin v1.2.3
#
# Le tag doit être celui de la version affichée par tools/version.ps1, sinon le build s'arrête avant de rien publier.
# Ne le pousse qu'une fois la version et les notes (docs/releases/<tag>.md) fusionnées dans main.
#
# Le commit du tag doit aussi appartenir à la branche par défaut : un tag posé sur une branche non fusionnée est refusé.
#
# Deux jobs : « build » ne fait que lire (tests, exe, zip, empreinte) ; « publication » est le seul dont le jeton peut
# écrire, et il n'exécute aucun code du dépôt.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : il faut pouvoir situer le tag par rapport à la branche par défaut

      - name: Le tag est sur la branche par défaut
        env:
          BRANCHE: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:BRANCHE"
          if ($LASTEXITCODE -ne 0) {
            throw "Le tag $env:GITHUB_REF_NAME pointe sur un commit qui n'est pas dans $env:BRANCHE : aucune release."
          }

      # <<STACK:outils>>

      - name: Le tag est celui de la version
        run: |
          $version = "$(./tools/version.ps1 | Select-Object -Last 1)".Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version $version donnée par tools/version.ps1."
          }

      - name: Tests
        run: ./tools/tester.ps1

      - name: Construire l'exe portable
        run: ./build.ps1

      - name: Zip, empreinte et BUILDINFO
        run: ./tools/empaqueter.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            .work/release/*.zip
            .work/release/*.zip.sha256
          include-hidden-files: true # .work commence par un point : sans cette ligne, l'action ignorerait le zip
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Seulement pour lire les notes de version : aucun code du dépôt n'est exécuté dans ce job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $zip = "release/Aria-{{NOM}}-$version.zip"
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) { $texte = @("--notes-file", $notes) } else { $texte = @("--generate-notes") }
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" --draft --verify-tag --title "Aria {{NOM}} $version" @texte
