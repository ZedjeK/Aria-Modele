# Release du socle : pousser un tag « vX.Y.Z » dans le dépôt modèle vérifie que la crate aria-coeur et le paquet
# aria-interface sont à cette version, emballe le paquet (aria-interface-X.Y.Z.tgz, l'archive que les applis
# installent), en calcule l'empreinte, atteste sa provenance, puis crée la release en BROUILLON. Tu relis les notes
# et tu publies : publier est le geste qui met la version à la disposition des applis (« Monter le socle »).
#
#     Set-Location C:\chemin\du\depot\modele
#     git switch main; git pull origin main
#     git tag -a v2.0.0 -m "Version 2.0.0" SHA_COMPLET_DU_COMMIT_DE_FUSION; git push origin v2.0.0
#
# Les notes sont la section « ## vX.Y.Z » de docs/MODELE-JOURNAL.md : sans elle, aucune release.
#
# Fichier du dépôt modèle seulement : init.ps1 le supprime dans l'appli créée.
name: Release du socle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  paquet:
    if: github.repository == 'ZedjeK/Aria-Modele'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tout l'historique : il faut pouvoir situer le tag par rapport à la branche par défaut

      - name: Le tag est sur la branche par défaut
        env:
          BRANCHE: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:BRANCHE"
          if ($LASTEXITCODE -ne 0) {
            throw "Le tag $env:GITHUB_REF_NAME pointe sur un commit qui n'est pas dans $env:BRANCHE : aucune release."
          }

      - name: Le tag est celui du socle, et les notes existent
        run: |
          $crate = (Select-String -LiteralPath socle/coeur/Cargo.toml -Pattern '^version\s*=\s*"(\d+\.\d+\.\d+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $paquet = (Get-Content -LiteralPath socle/interface/package.json -Raw | ConvertFrom-Json).version
          if ("v$crate" -ne $env:GITHUB_REF_NAME -or "v$paquet" -ne $env:GITHUB_REF_NAME) {
            throw "Le tag $env:GITHUB_REF_NAME n'est pas la version du socle (crate $crate, paquet $paquet)."
          }
          $journal = Get-Content -LiteralPath docs/MODELE-JOURNAL.md -Raw -Encoding UTF8
          $section = [regex]::Match($journal, "(?ms)^## $([regex]::Escape($env:GITHUB_REF_NAME))\s*\r?\n(.*?)(?=^## v|\z)")
          if (-not $section.Success -or -not $section.Groups[1].Value.Trim()) {
            throw "docs/MODELE-JOURNAL.md n'a pas de section « ## $env:GITHUB_REF_NAME » : aucune release sans notes."
          }
          New-Item -ItemType Directory -Path .work/release -Force | Out-Null
          [IO.File]::WriteAllText("$PWD/.work/release/notes.md", $section.Groups[1].Value.Trim() + "`n")

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: stacks/rust-tauri/.node-version

      - name: Tests du paquet de l'interface
        working-directory: socle/interface
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci a échoué." }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "svelte-check a échoué." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "vitest a échoué." }

      - name: Archive du paquet et empreinte
        run: |
          npm pack ./socle/interface --pack-destination .work/release
          if ($LASTEXITCODE -ne 0) { throw "npm pack a échoué." }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = ".work/release/aria-interface-$version.tgz"
          if (-not (Test-Path -LiteralPath $archive)) { throw "$archive est introuvable." }
          $empreinte = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/$archive.sha256", "$empreinte  aria-interface-$version.tgz`n")
          Write-Host "SHA-256 : $empreinte"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socle
          path: |
            .work/release/*.tgz
            .work/release/*.tgz.sha256
            .work/release/notes.md
          include-hidden-files: true # .work commence par un point
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: paquet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: socle
          path: release

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Release en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "release/aria-interface-$version.tgz"
          gh release create $env:GITHUB_REF_NAME $archive "$archive.sha256" --repo $env:DEPOT --draft --verify-tag `
            --title "Socle Aria $version" --notes-file release/notes.md
